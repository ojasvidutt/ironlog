<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRON LOG // Workout Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="config.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --border: #2a2a2a;
      --text-primary: #ffb000;
      --text-secondary: #888888;
      --accent: #00ff88;
      --danger: #ff4444;
      --input-bg: #0d0d0d;
    }

    body {
      font-family: "IBM Plex Mono", "Courier New", monospace;
      font-size: 0.9rem;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Header */
    .header {
      text-align: center;
      padding: 24px 16px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--text-primary);
    }

    .header p {
      font-size: 0.75rem;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    /* Navigation */
    .nav {
      display: flex;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-tab {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.1s, color 0.1s;
      border-bottom: 2px solid transparent;
    }

    .nav-tab:hover {
      background: rgba(255, 176, 0, 0.1);
    }

    .nav-tab.active {
      background: var(--text-primary);
      color: var(--bg);
      border-bottom-color: var(--text-primary);
    }

    /* Main Content */
    .main {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
      animation: fadeIn 150ms ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px;
      margin-bottom: 16px;
    }

    .card-header {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* Forms */
    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .form-row:last-child {
      margin-bottom: 0;
    }

    input, select, textarea {
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.1s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--text-primary);
    }

    input::placeholder, textarea::placeholder {
      color: #555;
    }

    input[type="number"] {
      width: 80px;
    }

    input[type="date"] {
      width: 140px;
    }

    input[type="text"], select {
      flex: 1;
    }

    textarea {
      width: 100%;
      min-height: 60px;
      resize: vertical;
    }

    /* Buttons */
    .btn {
      background: transparent;
      border: 1px solid var(--text-primary);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 8px 16px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background 0.1s, color 0.1s;
    }

    .btn:hover {
      background: var(--text-primary);
      color: var(--bg);
    }

    .btn-primary {
      background: var(--text-primary);
      color: var(--bg);
    }

    .btn-primary:hover {
      background: #ffc940;
    }

    .btn-danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-danger:hover {
      background: var(--danger);
      color: var(--bg);
    }

    .btn-small {
      padding: 4px 8px;
      font-size: 0.7rem;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Lists */
    .list {
      border: 1px solid var(--border);
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item:nth-child(even) {
      background: var(--input-bg);
    }

    .list-item-content {
      flex: 1;
    }

    .list-item-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Exercise List */
    .exercise-name {
      font-weight: 500;
    }

    /* Workout Exercise */
    .workout-exercise {
      padding: 12px;
      background: var(--input-bg);
      margin-bottom: 8px;
      border: 1px solid var(--border);
    }

    .workout-exercise:last-child {
      margin-bottom: 0;
    }

    .workout-exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .workout-exercise-name {
      font-weight: 600;
    }

    .workout-exercise-stats {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .workout-exercise-notes {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-style: italic;
      margin-top: 6px;
    }

    /* Bodyweight */
    .bodyweight-current {
      text-align: center;
      padding: 24px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .bodyweight-value {
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .bodyweight-unit {
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .bodyweight-trend {
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .bodyweight-trend.up {
      color: var(--accent);
    }

    .bodyweight-trend.down {
      color: var(--danger);
    }

    /* History */
    .history-item {
      border: 1px solid var(--border);
      margin-bottom: 12px;
      background: var(--surface);
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      cursor: pointer;
      background: var(--surface);
    }

    .history-header:hover {
      background: var(--input-bg);
    }

    .history-date {
      font-weight: 600;
    }

    .history-count {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .history-details {
      display: none;
      padding: 12px;
      border-top: 1px solid var(--border);
      background: var(--input-bg);
    }

    .history-details.expanded {
      display: block;
    }

    .history-exercise {
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .history-exercise:last-child {
      border-bottom: none;
    }

    .history-exercise-name {
      font-weight: 500;
    }

    .history-exercise-stats {
      color: var(--text-secondary);
    }

    /* Empty State */
    .empty {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Weight Input Group */
    .weight-input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .weight-input-group input {
      width: 100px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .nav-tab {
        padding: 10px 4px;
        font-size: 0.6rem;
      }

      .form-row {
        flex-wrap: wrap;
      }

      input[type="number"] {
        width: 60px;
      }

      .workout-exercise-stats {
        flex-wrap: wrap;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  

  <!-- Header -->
  <header class="header">
    <h1>IRON LOG</h1>
    <p>// WORKOUT TRACKER</p>
  </header>

  <!-- Navigation -->
  <nav class="nav">
    <button class="nav-tab active" data-tab="exercises">Exercises</button>
    <button class="nav-tab" data-tab="workout">Workout</button>
    <button class="nav-tab" data-tab="bodyweight">Bodyweight</button>
    <button class="nav-tab" data-tab="history">History</button>
  </nav>

  <!-- Main Content -->
  <main class="main">
    <!-- Exercises Section -->
    <section class="section active" id="exercises">
      <div class="card">
        <div class="card-header">Add Exercise</div>
        <div class="form-row">
          <input type="text" id="newExerciseName" placeholder="Exercise name (e.g., Bench Press)">
          <button class="btn btn-primary" onclick="addExercise()">Add</button>
        </div>
      </div>
      <div class="list" id="exerciseList">
        <div class="empty">No exercises yet. Add your first exercise above.</div>
      </div>
    </section>

    <!-- Workout Section -->
    <section class="section" id="workout">
      <div class="card">
        <div class="card-header">Workout Date</div>
        <input type="date" id="workoutDate">
      </div>
      <div class="card">
        <div class="card-header">Add Exercise</div>
        <div class="form-row">
          <select id="workoutExerciseSelect">
            <option value="">Select exercise...</option>
          </select>
          <button class="btn" onclick="showAddWorkoutForm()">+</button>
        </div>
        <div id="workoutForm" style="display: none; margin-top: 12px;">
          <div class="form-row">
            <input type="number" id="workoutSets" placeholder="Sets" min="1">
            <input type="number" id="workoutReps" placeholder="Reps" min="1">
            <input type="number" id="workoutRest" placeholder="Rest (sec)" min="0">
          </div>
          <div class="form-row">
            <textarea id="workoutNotes" placeholder="Notes (optional)"></textarea>
          </div>
          <div class="form-row">
            <button class="btn btn-primary" onclick="addToWorkout()">Add to Workout</button>
            <button class="btn" onclick="hideWorkoutForm()">Cancel</button>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header">Current Workout</div>
        <div id="currentWorkout">
          <div class="empty">No exercises added yet.</div>
        </div>
      </div>
      <div class="form-row">
        <button class="btn btn-primary" onclick="saveWorkout()">Save Workout</button>
        <button class="btn btn-danger" onclick="clearWorkout()">Clear</button>
      </div>
    </section>

    <!-- Bodyweight Section -->
    <section class="section" id="bodyweight">
      <div class="bodyweight-current" id="currentWeight">
        <div class="bodyweight-value">--</div>
        <div class="bodyweight-unit">lbs</div>
        <div class="bodyweight-trend" id="weightTrend"></div>
      </div>
      <div class="card">
        <div class="card-header">Log Weight</div>
        <div class="weight-input-group">
          <input type="number" id="bodyweightInput" placeholder="Weight" step="0.1" min="0">
          <button class="btn btn-primary" onclick="saveBodyweight()">Save</button>
        </div>
      </div>
      <div class="card">
        <div class="card-header">Recent Logs</div>
        <div class="list" id="bodyweightList">
          <div class="empty">No weight logs yet.</div>
        </div>
      </div>
    </section>

    <!-- History Section -->
    <section class="section" id="history">
      <div id="historyList">
        <div class="empty">No workouts recorded yet.</div>
      </div>
    </section>
  </main>

  <script>
    // State
    let supabaseUrl = '';
    let supabaseKey = '';
    let exercises = [];
    let currentWorkout = [];
    let bodyweightLogs = [];

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadConfig();
      setupNavigation();
      document.getElementById('workoutDate').value = new Date().toISOString().split('T')[0];
    });

    // Config
    function loadConfig() {
      // Load from config.js
      supabaseUrl = typeof SUPABASE_URL !== 'undefined' ? SUPABASE_URL : '';
      supabaseKey = typeof SUPABASE_KEY !== 'undefined' ? SUPABASE_KEY : '';
      
      if (supabaseUrl && supabaseKey) {
        loadData();
      } else {
        alert('Please configure config.js with your Supabase credentials');
      }
    }

    // Navigation
    function setupNavigation() {
      document.querySelectorAll('.nav-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
          
          tab.classList.add('active');
          document.getElementById(tab.dataset.tab).classList.add('active');
        });
      });
    }

    // API
    async function apiCall(endpoint, method = 'GET', body = null) {
      // Use Vercel API proxy in production, direct call for local dev
      const baseUrl = window.location.hostname === 'localhost' 
        ? `${supabaseUrl}/rest/v1` 
        : '/api/proxy';
      
      const options = {
        method,
        headers: {
          'Content-Type': 'application/json'
        }
      };
      
      if (body) {
        options.body = JSON.stringify(body);
      }
      
      const response = await fetch(`${baseUrl}/${endpoint}`, options);
      
      if (!response.ok) {
        const error = await response.text();
        throw new Error(error);
      }
      
      const text = await response.text();
      return text ? JSON.parse(text) : [];
    }

    // Load Data
    async function loadData() {
      await Promise.all([
        loadExercises(),
        loadBodyweightLogs(),
        loadHistory()
      ]);
    }

    // Exercises
    async function loadExercises() {
      try {
        exercises = await apiCall('exercises?select=*&order=name');
        renderExercises();
        updateExerciseSelect();
      } catch (e) {
        console.error('Failed to load exercises:', e);
      }
    }

    function renderExercises() {
      const list = document.getElementById('exerciseList');
      
      if (exercises.length === 0) {
        list.innerHTML = '<div class="empty">No exercises yet. Add your first exercise above.</div>';
        return;
      }
      
      list.innerHTML = exercises.map(ex => `
        <div class="list-item">
          <span class="exercise-name">${escapeHtml(ex.name)}</span>
          <div class="list-item-actions">
            <button class="btn btn-danger btn-small" onclick="deleteExercise(${ex.id})">×</button>
          </div>
        </div>
      `).join('');
    }

    async function addExercise() {
      const name = document.getElementById('newExerciseName').value.trim();
      if (!name) return;
      
      try {
        await apiCall('exercises', 'POST', { name });
        document.getElementById('newExerciseName').value = '';
        await loadExercises();
      } catch (e) {
        alert('Failed to add exercise: ' + e.message);
      }
    }

    async function deleteExercise(id) {
      if (!confirm('Delete this exercise?')) return;
      
      try {
        await apiCall(`exercises?id=eq.${id}`, 'DELETE');
        await loadExercises();
      } catch (e) {
        alert('Failed to delete exercise: ' + e.message);
      }
    }

    function updateExerciseSelect() {
      const select = document.getElementById('workoutExerciseSelect');
      select.innerHTML = '<option value="">Select exercise...</option>' + 
        exercises.map(ex => `<option value="${ex.id}">${escapeHtml(ex.name)}</option>`).join('');
    }

    // Workout
    function showAddWorkoutForm() {
      const select = document.getElementById('workoutExerciseSelect');
      if (!select.value) {
        alert('Please select an exercise first');
        return;
      }
      document.getElementById('workoutForm').style.display = 'block';
    }

    function hideWorkoutForm() {
      document.getElementById('workoutForm').style.display = 'none';
      document.getElementById('workoutSets').value = '';
      document.getElementById('workoutReps').value = '';
      document.getElementById('workoutRest').value = '';
      document.getElementById('workoutNotes').value = '';
    }

    function addToWorkout() {
      const select = document.getElementById('workoutExerciseSelect');
      const exerciseId = parseInt(select.value);
      const exercise = exercises.find(e => e.id === exerciseId);
      
      if (!exercise) return;
      
      const sets = parseInt(document.getElementById('workoutSets').value) || 0;
      const reps = parseInt(document.getElementById('workoutReps').value) || 0;
      const rest = parseInt(document.getElementById('workoutRest').value) || 0;
      const notes = document.getElementById('workoutNotes').value.trim();
      
      if (sets === 0 || reps === 0) {
        alert('Please enter sets and reps');
        return;
      }
      
      currentWorkout.push({
        exerciseId,
        name: exercise.name,
        sets,
        reps,
        rest,
        notes
      });
      
      hideWorkoutForm();
      select.value = '';
      renderCurrentWorkout();
    }

    function renderCurrentWorkout() {
      const container = document.getElementById('currentWorkout');
      
      if (currentWorkout.length === 0) {
        container.innerHTML = '<div class="empty">No exercises added yet.</div>';
        return;
      }
      
      container.innerHTML = currentWorkout.map((we, idx) => `
        <div class="workout-exercise">
          <div class="workout-exercise-header">
            <span class="workout-exercise-name">${escapeHtml(we.name)}</span>
            <button class="btn btn-danger btn-small" onclick="removeFromWorkout(${idx})">×</button>
          </div>
          <div class="workout-exercise-stats">
            <span>${we.sets} sets × ${we.reps} reps</span>
            <span>Rest: ${we.rest}s</span>
          </div>
          ${we.notes ? `<div class="workout-exercise-notes">${escapeHtml(we.notes)}</div>` : ''}
        </div>
      `).join('');
    }

    function removeFromWorkout(idx) {
      currentWorkout.splice(idx, 1);
      renderCurrentWorkout();
    }

    function clearWorkout() {
      if (!confirm('Clear current workout?')) return;
      currentWorkout = [];
      renderCurrentWorkout();
    }

    async function saveWorkout() {
      if (currentWorkout.length === 0) {
        alert('No exercises to save');
        return;
      }
      
      const date = document.getElementById('workoutDate').value;
      const notes = '';
      
      try {
        // Create workout
        const workoutResult = await apiCall('workouts', 'POST', { date, notes });
        const workoutId = workoutResult[0]?.id;
        
        // Add exercises
        for (const we of currentWorkout) {
          await apiCall('workout_exercises', 'POST', {
            workout_id: workoutId,
            exercise_id: we.exerciseId,
            sets: we.sets,
            reps: we.reps,
            rest_seconds: we.rest,
            notes: we.notes
          });
        }
        
        alert('Workout saved!');
        currentWorkout = [];
        renderCurrentWorkout();
        await loadHistory();
      } catch (e) {
        alert('Failed to save workout: ' + e.message);
      }
    }

    // Bodyweight
    async function loadBodyweightLogs() {
      try {
        bodyweightLogs = await apiCall('bodyweight_logs?select=*&order=date.desc&limit=30');
        renderBodyweightLogs();
        updateCurrentWeight();
      } catch (e) {
        console.error('Failed to load bodyweight:', e);
      }
    }

    function updateCurrentWeight() {
      const container = document.getElementById('currentWeight');
      const trendEl = document.getElementById('weightTrend');
      
      if (bodyweightLogs.length === 0) {
        container.querySelector('.bodyweight-value').textContent = '--';
        trendEl.textContent = '';
        return;
      }
      
      const current = bodyweightLogs[0].weight;
      container.querySelector('.bodyweight-value').textContent = current;
      
      // Calculate 7-day average
      const last7 = bodyweightLogs.slice(0, 7);
      const avg = last7.reduce((sum, l) => sum + parseFloat(l.weight), 0) / last7.length;
      const diff = current - avg;
      
      if (Math.abs(diff) > 0.1) {
        trendEl.textContent = diff > 0 ? `↑ ${diff.toFixed(1)} lbs from 7-day avg` : `↓ ${Math.abs(diff).toFixed(1)} lbs from 7-day avg`;
        trendEl.className = 'bodyweight-trend ' + (diff > 0 ? 'up' : 'down');
      } else {
        trendEl.textContent = '';
      }
    }

    function renderBodyweightLogs() {
      const list = document.getElementById('bodyweightList');
      
      if (bodyweightLogs.length === 0) {
        list.innerHTML = '<div class="empty">No weight logs yet.</div>';
        return;
      }
      
      list.innerHTML = bodyweightLogs.map(log => `
        <div class="list-item">
          <span class="list-item-content">${log.date}</span>
          <div class="list-item-actions">
            <span style="color: var(--text-primary); font-weight: 500;">${log.weight} lbs</span>
            <button class="btn btn-danger btn-small" onclick="deleteBodyweight(${log.id})">×</button>
          </div>
        </div>
      `).join('');
    }

    async function saveBodyweight() {
      const weight = parseFloat(document.getElementById('bodyweightInput').value);
      const date = new Date().toISOString().split('T')[0];
      
      if (!weight || weight <= 0) {
        alert('Please enter a valid weight');
        return;
      }
      
      try {
        await apiCall('bodyweight_logs', 'POST', { date, weight });
        document.getElementById('bodyweightInput').value = '';
        await loadBodyweightLogs();
      } catch (e) {
        alert('Failed to save weight: ' + e.message);
      }
    }

    async function deleteBodyweight(id) {
      if (!confirm('Delete this weight log?')) return;
      
      try {
        await apiCall(`bodyweight_logs?id=eq.${id}`, 'DELETE');
        await loadBodyweightLogs();
      } catch (e) {
        alert('Failed to delete: ' + e.message);
      }
    }

    // History
    async function loadHistory() {
      try {
        const workouts = await apiCall('workouts?select=*&order=date.desc');
        const allExercises = await apiCall('exercises?select=*');
        
        for (const workout of workouts) {
          const workoutExercises = await apiCall(`workout_exercises?workout_id=eq.${workout.id}&select=*`);
          workout.exercises = workoutExercises.map(we => ({
            ...we,
            exerciseName: allExercises.find(ex => ex.id === we.exercise_id)?.name || 'Unknown'
          }));
        }
        
        renderHistory(workouts);
      } catch (e) {
        console.error('Failed to load history:', e);
      }
    }

    function renderHistory(workouts) {
      const container = document.getElementById('historyList');
      
      if (workouts.length === 0) {
        container.innerHTML = '<div class="empty">No workouts recorded yet.</div>';
        return;
      }
      
      container.innerHTML = workouts.map(w => `
        <div class="history-item">
          <div class="history-header" onclick="toggleHistory(${w.id})">
            <span class="history-date">${w.date}</span>
            <span class="history-count">${w.exercises.length} exercises</span>
          </div>
          <div class="history-details" id="history-${w.id}">
            ${w.exercises.map(e => `
              <div class="history-exercise">
                <div class="history-exercise-name">${escapeHtml(e.exerciseName)}</div>
                <div class="history-exercise-stats">${e.sets} sets × ${e.reps} reps · Rest: ${e.rest_seconds}s</div>
                ${e.notes ? `<div class="workout-exercise-notes">${escapeHtml(e.notes)}</div>` : ''}
              </div>
            `).join('')}
            <button class="btn btn-danger btn-small" style="margin-top: 12px;" onclick="deleteWorkout(${w.id})">Delete Workout</button>
          </div>
        </div>
      `).join('');
    }

    function toggleHistory(id) {
      const el = document.getElementById(`history-${id}`);
      el.classList.toggle('expanded');
    }

    async function deleteWorkout(id) {
      if (!confirm('Delete this workout? This cannot be undone.')) return;
      
      try {
        await apiCall(`workouts?id=eq.${id}`, 'DELETE');
        await loadHistory();
      } catch (e) {
        alert('Failed to delete workout: ' + e.message);
      }
    }

    // Utilities
    function escapeHtml(text) {
      if (typeof text !== 'string') return text;
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
